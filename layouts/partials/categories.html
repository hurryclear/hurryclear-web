{{- /* Right-rail category list (marginalia — no card). */ -}}
<section class="flex flex-col gap-y-2 text-sm">
  <h2 class="font-semibold uppercase tracking-wide text-xs text-slate-500 dark:text-slate-400">{{ T "taxonomies.categories" }}</h2>
  {{ with site.Taxonomies.categories }}
    <ul class="flex flex-col gap-y-1">
      {{ range .ByCount }}
        <li>
          <a href="{{ .Page.RelPermalink }}" class="flex items-center justify-between text-slate-600 dark:text-slate-300 hover:text-emerald-600">
            <span>{{ .Page.LinkTitle }}</span>
            <span class="text-slate-400 dark:text-slate-500">{{ .Count }}</span>
          </a>
        </li>
      {{ end }}
    </ul>
    <a class="font-medium hover:text-emerald-600" href="{{ "categories/" | relLangURL }}">All categories &rarr;</a>
  {{ else }}
    <p class="text-slate-500 dark:text-slate-400">No categories yet.</p>
  {{ end }}
</section>
